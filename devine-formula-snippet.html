<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devine Formula - For the Relentless</title>
  <style>
    :root {
      color-scheme: only dark;
      --gold-light: #f8e08d;
      --gold-mid: #d2a742;
      --gold-deep: #8f5b16;
      --jet: #0d0d0d;
      --bolt: #c10f19;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 25% 25%, #2b2b2b 0%, #161616 45%, var(--jet) 100%);
      font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
      color: white;
    }

    .logo-card {
      padding: clamp(2.5rem, 5vw, 4rem);
      text-align: center;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.3));
      border-radius: 24px;
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 520px;
      width: min(90vw, 520px);
    }

    .headline {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(0.75rem, 1.4vw, 1.2rem);
      font-size: clamp(2.6rem, 6vw, 4.1rem);
      font-weight: 800;
      letter-spacing: 0.28rem;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 55%, var(--gold-deep) 100%);
      -webkit-background-clip: text;
      color: transparent;
      position: relative;
    }

    .headline span {
      display: inline-block;
      line-height: 1;
    }

    .bolt {
      width: clamp(1.1rem, 2.5vw, 1.8rem);
      height: clamp(3.6rem, 7vw, 4.6rem);
      position: relative;
    }

    .bolt::before,
    .bolt::after {
      content: "";
      position: absolute;
      background: var(--bolt);
      clip-path: polygon(50% 0, 70% 0, 40% 45%, 70% 45%, 30% 100%, 50% 55%, 20% 55%);
      inset: 0;
    }

    .tagline {
      margin-top: clamp(1.25rem, 3vw, 2rem);
      font-size: clamp(1.05rem, 2.6vw, 1.4rem);
      letter-spacing: 0.4rem;
      text-transform: uppercase;
      font-weight: 600;
      color: rgba(255, 241, 199, 0.85);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .tagline::before,
    .tagline::after {
      content: "";
      flex: 1 1 38px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 231, 170, 0.7), transparent);
    }

    .trademark {
      font-size: clamp(0.65rem, 1.3vw, 0.85rem);
      letter-spacing: 0.4em;
      margin-top: clamp(1.5rem, 3.5vw, 2.4rem);
      color: rgba(255, 220, 150, 0.55);
    }
  </style>
</head>
<body>
  <article class="logo-card" aria-label="Devine Formula brand mark">
    <h1 class="headline">
      <span>Devine</span>
      <span class="bolt" aria-hidden="true"></span>
      <span>Formula</span>
      <span aria-hidden="true" style="font-size: clamp(0.65rem, 1.4vw, 0.9rem); margin-left: 0.4rem;">™</span>
    </h1>
    <p class="tagline">For the Relentless</p>
    <p class="trademark">Devine Formula</p>
  </article>
</body>
</html>
